version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    AWS_ACCOUNT_ID: "157305260149"
    ECR_REPO: production/rapidbooth-api
    IMAGE_TAG: latest
    ECS_CLUSTER: production-platform
    ECS_SERVICE: rapidbooth-api

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO
      - COMMIT_TAG=$(date -u +%Y%m%d%H%M%S)
  build:
    commands:
      - echo Building rapidbooth-api image...
      - docker build -f Dockerfile.aws -t $REPO_URI:$IMAGE_TAG -t $REPO_URI:$COMMIT_TAG .
  post_build:
    commands:
      - echo Pushing images...
      - docker push $REPO_URI:$IMAGE_TAG
      - docker push $REPO_URI:$COMMIT_TAG
      - echo Forcing ECS service redeployment...
      - aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment --region $AWS_REGION > /dev/null
      - echo Done.
